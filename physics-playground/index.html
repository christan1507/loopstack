<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.6); padding: 8px 20px; border-radius: 50px;
    cursor: pointer; font-size: 12px; letter-spacing: 0.5px; transition: all 0.3s;
  }
  .btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  #hint {
    position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.2); font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; z-index: 3;
  }
</style>
</head>
<body>
<div id="ui">
  <button class="btn" id="reset">Reset</button>
  <button class="btn" id="explode">Explode</button>
  <button class="btn" id="gravity">Toggle Gravity</button>
  <button class="btn" id="add">Add Shape</button>
</div>
<div id="hint">Click objects to push them &bull; Drag background to orbit</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080f);
scene.fog = new THREE.FogExp2(0x08080f, 0.03);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxDistance = 30;

scene.add(new THREE.AmbientLight(0x404060, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(8, 12, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.far = 50;
scene.add(dirLight);

// Ground
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.8, metalness: 0.2 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 40, 0x222233, 0x111122);
grid.position.y = 0.01;
scene.add(grid);

// Physics objects
const bodies = [];
const geos = [
  new THREE.BoxGeometry(0.8, 0.8, 0.8),
  new THREE.SphereGeometry(0.5, 16, 16),
  new THREE.ConeGeometry(0.5, 1, 16),
  new THREE.OctahedronGeometry(0.5),
  new THREE.TorusGeometry(0.4, 0.15, 8, 16),
  new THREE.TetrahedronGeometry(0.5),
  new THREE.DodecahedronGeometry(0.4),
  new THREE.CylinderGeometry(0.3, 0.5, 0.8, 8),
];
const bodyColors = [0x6366f1, 0xec4899, 0x06b6d4, 0xf59e0b, 0x10b981, 0x8b5cf6, 0xf43f5e, 0x14b8a6];

function createBody(x, y, z) {
  const geo = geos[Math.floor(Math.random() * geos.length)];
  const color = bodyColors[Math.floor(Math.random() * bodyColors.length)];
  const mat = new THREE.MeshPhysicalMaterial({
    color, roughness: 0.2, metalness: 0.6,
    clearcoat: 0.5, emissive: color, emissiveIntensity: 0.1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const body = {
    mesh,
    velocity: new THREE.Vector3(0, 0, 0),
    angularVel: new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2),
    radius: 0.6,
    restPos: mesh.position.clone(),
    springVel: new THREE.Vector3(),
  };
  bodies.push(body);
  return body;
}

// Initial cluster
for (let i = 0; i < 20; i++) {
  createBody((Math.random() - 0.5) * 6, 2 + Math.random() * 6, (Math.random() - 0.5) * 4);
}

let gravityOn = true;
const gravity = new THREE.Vector3(0, -9.8, 0);
const damping = 0.98;
const bounce = 0.6;
const groundY = 0.5;

// Mouse click to push
const raycaster = new THREE.Raycaster();
const clickMouse = new THREE.Vector2();
let clickPos3D = new THREE.Vector3();

window.addEventListener('click', e => {
  clickMouse.x = (e.clientX / innerWidth) * 2 - 1;
  clickMouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(clickMouse, camera);
  const intersects = raycaster.intersectObjects(bodies.map(b => b.mesh));
  if (intersects.length > 0) {
    const hit = intersects[0].object;
    const body = bodies.find(b => b.mesh === hit);
    if (body) {
      const dir = body.mesh.position.clone().sub(raycaster.ray.origin).normalize();
      body.velocity.add(dir.multiplyScalar(8));
      body.angularVel.add(new THREE.Vector3((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10));
    }
  } else {
    // Click empty space = shockwave
    const origin = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(5));
    bodies.forEach(b => {
      const dir = b.mesh.position.clone().sub(origin);
      const dist = dir.length();
      if (dist < 5) {
        dir.normalize().multiplyScalar(10 / (dist + 0.5));
        b.velocity.add(dir);
      }
    });
  }
});

// Buttons
document.getElementById('reset').addEventListener('click', () => {
  bodies.forEach((b, i) => {
    b.mesh.position.copy(b.restPos);
    b.velocity.set(0, 0, 0);
    b.angularVel.set(0, 0, 0);
  });
});
document.getElementById('explode').addEventListener('click', () => {
  bodies.forEach(b => {
    const dir = b.mesh.position.clone().normalize().add(new THREE.Vector3(0, 0.5, 0)).normalize();
    b.velocity.add(dir.multiplyScalar(12));
  });
});
document.getElementById('gravity').addEventListener('click', () => {
  gravityOn = !gravityOn;
  document.getElementById('gravity').textContent = gravityOn ? 'Gravity: ON' : 'Gravity: OFF';
});
document.getElementById('add').addEventListener('click', () => {
  createBody((Math.random() - 0.5) * 4, 5 + Math.random() * 3, (Math.random() - 0.5) * 4);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  bodies.forEach(b => {
    // Gravity
    if (gravityOn) b.velocity.add(gravity.clone().multiplyScalar(dt));
    b.velocity.multiplyScalar(damping);
    b.mesh.position.add(b.velocity.clone().multiplyScalar(dt));

    // Angular velocity
    b.mesh.rotation.x += b.angularVel.x * dt;
    b.mesh.rotation.y += b.angularVel.y * dt;
    b.mesh.rotation.z += b.angularVel.z * dt;
    b.angularVel.multiplyScalar(0.995);

    // Ground collision
    if (b.mesh.position.y < groundY) {
      b.mesh.position.y = groundY;
      b.velocity.y = Math.abs(b.velocity.y) * bounce;
    }

    // Wall bounds
    if (Math.abs(b.mesh.position.x) > 18) { b.mesh.position.x = Math.sign(b.mesh.position.x) * 18; b.velocity.x *= -bounce; }
    if (Math.abs(b.mesh.position.z) > 10) { b.mesh.position.z = Math.sign(b.mesh.position.z) * 10; b.velocity.z *= -bounce; }
    if (b.mesh.position.y > 15) { b.mesh.position.y = 15; b.velocity.y *= -bounce; }
  });

  // Simple body-body collision (sphere approximation)
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const a = bodies[i], b = bodies[j];
      const diff = a.mesh.position.clone().sub(b.mesh.position);
      const dist = diff.length();
      const minDist = a.radius + b.radius;
      if (dist < minDist && dist > 0.001) {
        const normal = diff.normalize();
        const overlap = minDist - dist;
        a.mesh.position.add(normal.clone().multiplyScalar(overlap * 0.5));
        b.mesh.position.sub(normal.clone().multiplyScalar(overlap * 0.5));
        // Swap velocities along collision normal
        const relVel = a.velocity.clone().sub(b.velocity);
        const velAlongNormal = relVel.dot(normal);
        if (velAlongNormal > 0) continue;
        const impulse = normal.multiplyScalar(-velAlongNormal * bounce);
        a.velocity.add(impulse);
        b.velocity.sub(impulse);
      }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
