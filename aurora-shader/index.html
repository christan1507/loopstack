<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Shader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 2;
  }
  .aurora-title {
    font-family: 'Georgia', serif; font-size: clamp(2.5rem, 7vw, 6rem);
    color: rgba(255,255,255,0.06); font-weight: 300;
    letter-spacing: 0.15em; text-transform: uppercase;
  }
  #controls {
    position: fixed; bottom: 25px; right: 25px;
    display: flex; gap: 8px; z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.4); padding: 6px 16px; border-radius: 50px;
    cursor: pointer; font-size: 11px; letter-spacing: 0.5px; transition: all 0.3s;
  }
  .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .btn.active { background: rgba(255,255,255,0.12); color: #fff; }
</style>
</head>
<body>
<div id="overlay"><div class="aurora-title">Aurora</div></div>
<div id="controls">
  <button class="btn active" data-palette="northern">Northern</button>
  <button class="btn" data-palette="sunset">Sunset</button>
  <button class="btn" data-palette="ocean">Ocean</button>
  <button class="btn" data-palette="neon">Neon</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uPalette: { value: 0 },
};

const vertexShader = `void main() { gl_Position = vec4(position, 1.0); }`;

const fragmentShader = `
precision highp float;
uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uMouse;
uniform int uPalette;
out vec4 fragColor;

vec3 mod289v3(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec2 mod289v2(vec2 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289v3(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = x0.x > x0.y ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
  i = mod289v2(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x_ = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x_) - 0.5;
  vec3 ox = floor(x_ + 0.5);
  vec3 a0 = x_ - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0+h*h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

float fbm(vec2 p) {
  float f = 0.0, w = 0.5;
  for (int i = 0; i < 5; i++) { f += w * snoise(p); p *= 2.0; w *= 0.5; }
  return f;
}

vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
  return a + b * cos(6.28318 * (c * t + d));
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  float aspect = uResolution.x / uResolution.y;
  vec2 p = (uv - 0.5) * vec2(aspect, 1.0);
  vec2 mouse = (uMouse - 0.5) * 0.3;
  p += mouse * (1.0 - length(p) * 0.5);
  float t = uTime * 0.15;

  float n1 = fbm(p * 1.5 + vec2(t * 0.7, t * 0.3));
  float n2 = fbm(p * 2.0 + vec2(-t * 0.5, t * 0.4) + n1 * 0.5);
  float n3 = fbm(p * 3.0 + vec2(t * 0.3, -t * 0.6) + n2 * 0.3);

  float falloff = smoothstep(-0.5, 0.8, uv.y) * smoothstep(1.2, 0.3, uv.y);
  vec3 col;
  if (uPalette == 0) {
    col = palette(n1*0.5+0.5, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
    col = mix(col, palette(n2*0.5+0.5, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.1, 0.2)), 0.5);
  } else if (uPalette == 1) {
    col = palette(n1*0.5+0.5, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.1, 0.2));
    col = mix(col, vec3(0.9, 0.3, 0.1) * (n2*0.5+0.5), 0.3);
  } else if (uPalette == 2) {
    col = palette(n1*0.5+0.5, vec3(0.2), vec3(0.4), vec3(1.0), vec3(0.0, 0.5, 0.5));
    col = mix(col, vec3(0.0, 0.3, 0.5) * (n3*0.5+0.5), 0.4);
  } else {
    col = palette(n1*0.5+0.5, vec3(0.5), vec3(0.5), vec3(2.0), vec3(0.5, 0.2, 0.25));
    col = mix(col, vec3(0.1, 0.8, 0.6) * (n2*0.5+0.5), 0.3);
  }

  float brightness = falloff * (0.5 + 0.5*n1) * (0.6 + 0.4*n2);
  col *= brightness * 0.8;
  float vig = 1.0 - smoothstep(0.3, 1.5, length(p * 0.7));
  col *= vig;
  float stars = smoothstep(0.98, 1.0, snoise(uv * 300.0)) * smoothstep(0.4, 0.8, uv.y);
  col += vec3(stars * 0.3);
  fragColor = vec4(col, 1.0);
}
`;

const geo = new THREE.PlaneGeometry(2, 2);
const mat = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
scene.add(new THREE.Mesh(geo, mat));

window.addEventListener('mousemove', e => {
  uniforms.uMouse.value.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
});

document.querySelectorAll('.btn[data-palette]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-palette]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const map = { northern: 0, sunset: 1, ocean: 2, neon: 3 };
    uniforms.uPalette.value = map[b.dataset.palette] || 0;
  });
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uResolution.value.set(innerWidth, innerHeight);
});
</script>
</body>
</html>
