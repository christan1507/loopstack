<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Text in Space</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #controls {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #fff; padding: 8px 20px; border-radius: 50px; cursor: pointer;
    font-size: 12px; letter-spacing: 0.5px; transition: all 0.3s;
  }
  .btn:hover { background: rgba(255,255,255,0.15); }
  .btn.active { background: rgba(99,102,241,0.35); border-color: rgba(99,102,241,0.5); }
  #title-bar {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.2); font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 2;
  }
</style>
</head>
<body>
<a id="back" href="../" style="position:fixed;top:20px;left:20px;z-index:10;color:rgba(255,255,255,0.35);text-decoration:none;font-size:13px;font-family:sans-serif;letter-spacing:0.5px;transition:color 0.3s;">← Back to Metaskills Design</a>
<div id="title-bar">Move mouse to interact &bull; Scroll to zoom</div>
<div id="controls">
  <button class="btn active" data-mode="orbit">Orbit</button>
  <button class="btn" data-mode="explode">Explode</button>
  <button class="btn" data-mode="wave">Wave</button>
  <button class="btn" data-mode="vortex">Vortex</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050a);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

window.addEventListener('wheel', e => {
  camera.position.z = Math.max(15, Math.min(100, camera.position.z + e.deltaY * 0.05));
});

const group = new THREE.Group();
scene.add(group);

const words = ['CREATE', 'BUILD', 'DESIGN', 'INNOVATE', 'DREAM', 'INSPIRE'];
const colors = [0x6366f1, 0xec4899, 0x06b6d4, 0xf59e0b, 0x10b981, 0x8b5cf6];

function createLetterSprite(char, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
  ctx.font = 'bold 100px Segoe UI, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4, 4, 1);
  return sprite;
}

function buildWord(word) {
  while (group.children.length) {
    const c = group.children[0];
    if (c.material.map) c.material.map.dispose();
    c.material.dispose();
    group.remove(c);
  }
  const cols = word.length;
  const spacing = 5;
  for (let c = 0; c < cols; c++) {
    const sprite = createLetterSprite(word[c], colors[c % colors.length]);
    sprite.position.set((c - cols / 2) * spacing, 0, 0);
    sprite.userData = { origX: sprite.position.x, origY: 0, col: c };
    group.add(sprite);
  }
}
buildWord(words[0]);

// Background particles
const bgCount = 2000;
const bgPos = new Float32Array(bgCount * 3);
for (let i = 0; i < bgCount; i++) {
  bgPos[i * 3] = (Math.random() - 0.5) * 200;
  bgPos[i * 3 + 1] = (Math.random() - 0.5) * 200;
  bgPos[i * 3 + 2] = (Math.random() - 0.5) * 200;
}
const bgGeo = new THREE.BufferGeometry();
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ color: 0x8888ff, size: 0.4, transparent: true, opacity: 0.6 })));

const mouse = new THREE.Vector2();
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

let mode = 'orbit';
let wordIndex = 0;
document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    if (mode === 'explode') { wordIndex = (wordIndex + 1) % words.length; buildWord(words[wordIndex]); }
  });
});

setInterval(() => {
  if (mode === 'explode') { wordIndex = (wordIndex + 1) % words.length; buildWord(words[wordIndex]); }
}, 4000);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  group.children.forEach((sprite, i) => {
    const d = sprite.userData;
    switch (mode) {
      case 'orbit':
        sprite.position.x = d.origX + Math.sin(t * 0.5 + d.col * 0.5) * 0.3 + mouse.x * 0.5;
        sprite.position.y = Math.cos(t * 0.4 + d.col * 0.5) * 0.3 + mouse.y * 0.5;
        sprite.position.z = Math.sin(t + i * 0.3) * 0.5;
        break;
      case 'explode':
        const dist = 2 + Math.sin(t * 0.5) * 1.5;
        sprite.position.x = d.origX + Math.cos(t + i) * dist;
        sprite.position.y = Math.sin(t * 0.7 + i) * dist;
        sprite.position.z = Math.sin(t * 0.3 + i * 0.5) * dist;
        break;
      case 'wave':
        sprite.position.x = d.origX;
        sprite.position.y = Math.sin(t * 2 + d.col * 0.8) * 2;
        sprite.position.z = Math.cos(t * 1.5 + d.col * 0.6) * 3;
        sprite.material.opacity = 0.4 + Math.sin(t + d.col) * 0.4;
        break;
      case 'vortex':
        const angle = t * 0.8 + i * 0.4;
        const radius = 1 + i * 0.5;
        sprite.position.x = Math.cos(angle) * radius;
        sprite.position.y = Math.sin(angle) * radius;
        sprite.position.z = Math.sin(t + i * 0.2) * 5;
        sprite.material.rotation = angle;
        break;
    }
  });
  camera.position.x += (mouse.x * 3 - camera.position.x) * 0.02;
  camera.position.y += (mouse.y * 2 - camera.position.y) * 0.02;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
