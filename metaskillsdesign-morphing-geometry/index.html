<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Geometry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #back {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(255,255,255,0.35); text-decoration: none; font-size: 13px;
    font-family: sans-serif; letter-spacing: 0.5px;
    transition: color 0.3s;
  }
  #back:hover { color: #fff; }
  #ui {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 10px 22px; border-radius: 50px; cursor: pointer;
    font-size: 13px; letter-spacing: 0.5px; transition: all 0.3s;
  }
  .btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }
  .btn.active { background: rgba(99,102,241,0.5); border-color: rgba(99,102,241,0.7); }
  #info {
    position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase;
  }
  #progress-bar {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 3px; background: rgba(255,255,255,0.1);
    border-radius: 2px; z-index: 10; overflow: hidden;
  }
  #progress-fill {
    height: 100%; width: 0%; background: #6366f1;
    border-radius: 2px; transition: width 0.05s linear;
  }
</style>
</head>
<body>
<a id="back" href="../">← Back to Metaskills Design</a>
<div id="info">Click a shape to morph</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="ui">
  <button class="btn active" data-target="sphere">Sphere</button>
  <button class="btn" data-target="torus">Torus</button>
  <button class="btn" data-target="cube">Cube</button>
  <button class="btn" data-target="icosa">Icosa</button>
  <button class="btn" data-target="octahedron">Octa</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.8;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.85));

// Bright lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const keyLight = new THREE.DirectionalLight(0xffffff, 6);
keyLight.position.set(5, 5, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x6366f1, 8);
rimLight.position.set(-5, 3, -5);
scene.add(rimLight);
const fillLight = new THREE.PointLight(0xec4899, 6, 25);
fillLight.position.set(0, -3, 3);
scene.add(fillLight);
const topLight = new THREE.PointLight(0x06b6d4, 4, 20);
topLight.position.set(0, 8, 0);
scene.add(topLight);

// Target geometry morphing
function createTarget(type) {
  const geo = new THREE.SphereGeometry(1.5, 64, 64);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    switch(type) {
      case 'torus': {
        const R = 1.2, r = 0.5;
        const u = Math.acos(Math.max(-1, Math.min(1, v.y / v.length())));
        const w = Math.atan2(v.x, v.z);
        v.set((R + r * Math.cos(u)) * Math.sin(w), r * Math.sin(u), (R + r * Math.cos(u)) * Math.cos(w));
        break;
      }
      case 'cube': {
        const s = 1.3;
        v.set(s * Math.sign(v.x) * Math.pow(Math.abs(v.x / s), 1/3),
               s * Math.sign(v.y) * Math.pow(Math.abs(v.y / s), 1/3),
               s * Math.sign(v.z) * Math.pow(Math.abs(v.z / s), 1/3));
        break;
      }
      case 'icosa':
      case 'octahedron':
        v.normalize().multiplyScalar(1.4);
        break;
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return new Float32Array(pos.array);
}

const baseGeo = new THREE.SphereGeometry(1.5, 64, 64);
const basePos = new Float32Array(baseGeo.attributes.position.array);
const targets = {
  sphere: new Float32Array(basePos),
  torus: createTarget('torus'),
  cube: createTarget('cube'),
  icosa: createTarget('icosa'),
  octahedron: createTarget('octahedron'),
};
baseGeo.dispose();

const mat = new THREE.MeshPhysicalMaterial({
  color: 0xaaaaff, roughness: 0.1, metalness: 0.2,
  clearcoat: 1.0, clearcoatRoughness: 0.05,
  emissive: 0x4444aa, emissiveIntensity: 0.6,
  side: THREE.DoubleSide,
});
const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 64, 64), mat);
scene.add(mesh);

let currentTarget = 'sphere';
let morphT = 1;
const MORPH_SPEED = 0.035;

document.querySelectorAll('.btn[data-target]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-target]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentTarget = b.dataset.target;
    morphT = 0;
  });
});

const mouse = new THREE.Vector2();
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

const clock = new THREE.Clock();
const progressFill = document.getElementById('progress-fill');

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (morphT < 1) {
    morphT = Math.min(1, morphT + MORPH_SPEED);
  }
  progressFill.style.width = (morphT * 100) + '%';

  const ease = morphT < 0.5
    ? 2 * morphT * morphT
    : 1 - Math.pow(-2 * morphT + 2, 2) / 2;

  const from = targets[currentTarget];
  const pos = mesh.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;
    let x = basePos[ix] + (from[ix] - basePos[ix]) * ease;
    let y = basePos[iy] + (from[iy] - basePos[iy]) * ease;
    let z = basePos[iz] + (from[iz] - basePos[iz]) * ease;
    const dist = Math.sqrt(x * x + y * y);
    const influence = Math.max(0, 1 - dist / 2.5);
    x += mouse.x * influence * 0.4;
    y += mouse.y * influence * 0.4;
    z += Math.sin(t * 2 + dist * 3) * influence * 0.2;
    pos.setXYZ(i, x, y, z);
  }
  pos.needsUpdate = true;
  mesh.geometry.computeVertexNormals();

  mesh.rotation.y = t * 0.3;
  mesh.rotation.x = Math.sin(t * 0.2) * 0.15;

  rimLight.position.x = Math.sin(t * 0.5) * 5;
  rimLight.position.z = Math.cos(t * 0.5) * 5;
  fillLight.position.x = Math.cos(t * 0.3) * 5;

  composer.render();
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
