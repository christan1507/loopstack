<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive 3D Product Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 10px 24px; border-radius: 50px; cursor: pointer;
    font-size: 13px; letter-spacing: 0.5px; backdrop-filter: blur(20px);
    transition: all 0.3s;
  }
  .btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }
  .btn.active { background: rgba(99,102,241,0.4); border-color: rgba(99,102,241,0.6); }
  #info {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase;
  }
  #color-picker {
    position: fixed; top: 30px; right: 30px; display: flex; gap: 8px; z-index: 10;
  }
  .swatch {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.2); transition: all 0.3s;
  }
  .swatch:hover { transform: scale(1.2); border-color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div id="info">Drag to rotate &bull; Scroll to zoom &bull; Right-click to pan</div>
<div id="color-picker">
  <div class="swatch" style="background:#6366f1" data-color="0x6366f1"></div>
  <div class="swatch" style="background:#ec4899" data-color="0xec4899"></div>
  <div class="swatch" style="background:#06b6d4" data-color="0x06b6d4"></div>
  <div class="swatch" style="background:#f59e0b" data-color="0xf59e0b"></div>
  <div class="swatch" style="background:#10b981" data-color="0x10b981"></div>
</div>
<div id="ui">
  <button class="btn active" data-shape="torus">Torus Knot</button>
  <button class="btn" data-shape="sphere">Sphere</button>
  <button class="btn" data-shape="icosa">Icosahedron</button>
  <button class="btn" data-shape="ring">Ring</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 5, 25);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 3;
controls.maxDistance = 15;
controls.autoRotate = true;
controls.autoRotateSpeed = 1;

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const keyLight = new THREE.DirectionalLight(0xffffff, 2);
keyLight.position.set(5, 5, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x6366f1, 3);
rimLight.position.set(-5, 3, -5);
scene.add(rimLight);
const fillLight = new THREE.PointLight(0xec4899, 2, 20);
fillLight.position.set(0, -3, 3);
scene.add(fillLight);

// Ground plane
const groundGeo = new THREE.CircleGeometry(10, 64);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.3, metalness: 0.8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.5;
scene.add(ground);

const grid = new THREE.GridHelper(20, 40, 0x222233, 0x111122);
grid.position.y = -1.49;
scene.add(grid);

// Product mesh
let mesh;
const material = new THREE.MeshPhysicalMaterial({
  color: 0x6366f1, roughness: 0.15, metalness: 0.9,
  clearcoat: 1.0, clearcoatRoughness: 0.1, envMapIntensity: 1.5,
});

function createMesh(type) {
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  let geo;
  switch(type) {
    case 'sphere': geo = new THREE.SphereGeometry(1.2, 64, 64); break;
    case 'icosa': geo = new THREE.IcosahedronGeometry(1.3, 1); break;
    case 'ring': geo = new THREE.TorusGeometry(1, 0.4, 32, 100); break;
    default: geo = new THREE.TorusKnotGeometry(1, 0.35, 128, 32);
  }
  mesh = new THREE.Mesh(geo, material);
  scene.add(mesh);
}
createMesh('torus');

// Particles
const particlesGeo = new THREE.BufferGeometry();
const count = 500;
const positions = new Float32Array(count * 3);
for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 20;
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particles = new THREE.Points(particlesGeo, new THREE.PointsMaterial({ color: 0x6366f1, size: 0.02, transparent: true, opacity: 0.6 }));
scene.add(particles);

// UI handlers
document.querySelectorAll('.btn[data-shape]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-shape]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    createMesh(btn.dataset.shape);
  });
});
document.querySelectorAll('.swatch').forEach(s => {
  s.addEventListener('click', () => {
    material.color.set(parseInt(s.dataset.color));
    particles.material.color.set(parseInt(s.dataset.color));
  });
});

const mouse = new THREE.Vector2();
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (mesh) { mesh.rotation.y = t * 0.3; mesh.position.y = Math.sin(t * 0.8) * 0.15; }
  particles.rotation.y = t * 0.02;
  rimLight.position.x = Math.sin(t * 0.5) * 5;
  rimLight.position.z = Math.cos(t * 0.5) * 5;
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
